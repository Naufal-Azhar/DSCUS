services:
  db:
    image: postgres:16-alpine
    container_name: decisionmirror-db
    environment:
      POSTGRES_DB: decisionmirror
      POSTGRES_USER: decisionmirror
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - decisionmirror-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decisionmirror"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: decisionmirror-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://decisionmirror:${DB_PASSWORD:-devpassword}@db:5432/decisionmirror
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - decisionmirror-network
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: decisionmirror-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    networks:
      - decisionmirror-network
    command: npm run dev

volumes:
  postgres_data:

networks:
  decisionmirror-network:
    driver: bridge
